# ── Audio ─────────────────────────────────────────────────────────────────────
audio:
  sample_rate: 16000
  channels: 1
  # Set to null to use system default; or run `python -m sounddevice` to list
  input_device: null
  output_device: null
  # VAD silence timeout before declaring end-of-turn (seconds).
  # This is dead latency on every turn — lower = snappier, too low = cuts off
  # slow talkers. Raised to 0.8 so Octavian can pause mid-sentence (common when
  # recovering / elderly) without Aria jumping in and cutting him off.
  vad_silence_duration: 0.8
  # Volume threshold (0.0–1.0) below which audio is considered silence
  vad_threshold: 0.5
  # Chunk size in ms fed to VAD
  vad_chunk_ms: 32

# ── Barge-in (interrupt Aria while she speaks) ─────────────────────────────────
barge_in:
  # Off by default: requires acoustic echo cancellation (speexdsp) + a suitable mic so
  # Aria doesn't hear herself. When disabled, the mic is muted during playback (no
  # barge-in) — the safe, always-working fallback.
  enabled: false
  # Consecutive speech chunks on the echo-cancelled mic before declaring a barge-in
  # (debounce against transient noise / residual echo).
  trigger_chunks: 4

# ── ASR (Whisper) ──────────────────────────────────────────────────────────────
asr:
  model_size: "tiny.en"           # tiny.en | base.en | small.en | medium.en
  device: "auto"                  # auto | cpu | cuda | mps
  compute_type: "int8"            # int8 | float16 | float32
  language: "en"
  beam_size: 1                    # 1 = fastest, higher = more accurate
  vad_filter: true

# ── LLM ───────────────────────────────────────────────────────────────────────
llm:
  # MLX backend (Mac M-series) — HuggingFace model ID, downloaded automatically
  mlx_model: "mlx-community/Qwen2.5-1.5B-Instruct-4bit"

  # llama.cpp backend (Jetson / fallback) — local GGUF file
  # Populated by scripts/download_models.sh
  model_path: "models/qwen2.5-3b-instruct-q4_k_m.gguf"
  n_ctx: 4096
  n_gpu_layers: -1                # -1 = all layers on Metal/CUDA
  n_threads: 6
  temperature: 0.4
  max_tokens: 120                 # per response turn — keeps answers concise and fast
  # How many past turns to keep in context (beyond system prompt + RAG)
  context_turns: 8
  # Streaming: emit tokens as they arrive
  stream: true

# ── TTS (Kokoro) ──────────────────────────────────────────────────────────────
tts:
  voice: "af_heart"               # af_heart | af_bella | am_adam | bf_emma
  speed: 1.1
  # Split LLM output into sentences for lower first-audio latency
  sentence_split: true

# ── RAG ───────────────────────────────────────────────────────────────────────
rag:
  db_path: "data/lancedb"
  table_name: "protocols"
  embedding_model: "BAAI/bge-small-en-v1.5"
  top_k: 3
  score_threshold: 0.35           # discard irrelevant chunks below this score

# ── Patient ───────────────────────────────────────────────────────────────────
patient:
  # The person this assistant serves. Used to address them by name in greetings and
  # proactive prompts. Override per-deployment in config/local.yaml.
  name: "Octavian"

# ── Memory ────────────────────────────────────────────────────────────────────
memory:
  patient_profiles_dir: "data/patient_profiles"
  # Max tokens for long-term summary injected into prompt
  summary_max_tokens: 300

# ── Safety ────────────────────────────────────────────────────────────────────
safety:
  # Any match forces an escalate_to_human tool call
  escalation_keywords:
    - "chest pain"
    - "chest hurts"
    - "chest hurting"
    - "pain in my chest"
    - "can't breathe"
    - "cannot breathe"
    - "can not breathe"
    - "hard to breathe"
    - "trouble breathing"
    - "difficulty breathing"
    - "heart attack"
    - "stroke"
    - "unconscious"
    - "not responding"
    - "overdose"
    - "suicidal"
    - "want to die"
    - "kill myself"
    - "severe bleeding"
    - "allergic reaction"
    - "anaphylaxis"

# ── Proactive (always-on, Aria initiates) ──────────────────────────────────────
proactive:
  enabled: true
  # How often the scheduler wakes to check triggers (seconds).
  tick_seconds: 45
  # No proactive speech inside this wrap-around window (local time). Medication
  # reminders and vitals alerts override it; check-ins and follow-ups do not.
  quiet_hours:
    start: "22:00"
    end: "07:00"
  # Interval check-in: fire if this long has passed since the last interaction.
  check_in_interval_minutes: 120
  # Memory follow-up: at most this many per day.
  follow_up_max_per_day: 1
  # Ask-to-engage gate.
  engage_prompt: "Octavian, is now a good time to talk?"
  # How long to wait for a reply to the engage prompt before treating it as no
  # response (seconds). On no response the engagement is re-armed, not discarded.
  engage_response_timeout_seconds: 30
  # If there is no response to the engage prompt, retry the same engagement after
  # this many minutes.
  retry_after_minutes: 30
  # Words that count as yes / no when Octavian answers the engage prompt.
  engage_yes: ["yes", "yeah", "yep", "sure", "okay", "ok", "go ahead", "fine", "please do"]
  engage_no: ["no", "not now", "later", "stop", "busy", "leave me", "go away", "not really"]
  # Vitals threshold trigger reads data/patient_profiles/<id>_vitals_feed.jsonl
  # (an external process / sensor appends {"type","value","timestamp"} lines).
  # A reading outside [min, max] fires an immediate engagement (overrides quiet hours).
  vitals_thresholds:
    heart_rate:        {min: 45,  max: 120}
    oxygen_saturation: {min: 92,  max: 100}
    blood_glucose:     {min: 70,  max: 250}
    temperature:       {min: 96.0, max: 100.4}
